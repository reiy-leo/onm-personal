<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>原料在线</title>
    <meta property="og:title" content="Material Online" />
    <meta property="og:site_name" content="Material Online" />
    <link rel="icon" href="/assets/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />
    <script>
      // 跟随系统深浅色：Kumo 读 <html data-mode>
      (function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)");
        var set = function () { document.documentElement.dataset.mode = m.matches ? "dark" : "light"; };
        set();
        m.addEventListener("change", set);
      })();
    </script>
    <!--PAGE_DATA-->
  </head>
  <body class="bg-kumo-canvas text-kumo-default">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
